name: Build MputPos Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21 (Required for Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web app
        run: |
          npm ci || npm install
          npm run build

      - name: Install Capacitor & generate Android project
        run: |
          npm install --no-save @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 @capacitor/assets
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          mkdir -p assets
          cp public/pwa-512x512.png assets/icon-only.png
          cp public/pwa-maskable-512x512.png assets/icon-foreground.png
          cp public/pwa-512x512.png assets/splash.png
          npx capacitor-assets generate --android --iconBackgroundColor '#EA580C' --splashBackgroundColor '#F8FAFC' || true
          npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MputPos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
