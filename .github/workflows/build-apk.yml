name: Build MputPos Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI: true
      npm_config_legacy_peer_deps: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21 (Required for Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web app
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Install Capacitor & generate Android project
        run: |
          npm install --legacy-peer-deps @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 @capacitor/assets
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          mkdir -p assets
          cp public/pwa-512x512.png assets/icon-only.png
          cp public/pwa-maskable-512x512.png assets/icon-foreground.png
          cp public/pwa-512x512.png assets/splash.png
          node -e "const fs=require('fs'),zlib=require('zlib');const w=512,h=512,raw=Buffer.alloc((w*4+1)*h);for(let y=0;y<h;y++){const row=y*(w*4+1);raw[row]=0;for(let x=0;x<w;x++){const i=row+1+x*4;raw[i]=0xEA;raw[i+1]=0x58;raw[i+2]=0x0C;raw[i+3]=0xFF;}}const crc=(b)=>{let c=0xFFFFFFFF;for(const v of b){c^=v;for(let k=0;k<8;k++)c=(c>>>1)^(c&1?0xEDB88320:0);}return(c^0xFFFFFFFF)>>>0;};const chk=(t,d)=>{const b=Buffer.alloc(4+d.length);b.write(t);d.copy(b,4);const o=Buffer.alloc(12+d.length);o.writeUInt32BE(d.length,0);b.copy(o,4);o.writeUInt32BE(crc(b),8+d.length);return o;};const ihdr=Buffer.alloc(13);ihdr.writeUInt32BE(w,0);ihdr.writeUInt32BE(h,4);ihdr[8]=8;ihdr[9]=6;fs.writeFileSync('assets/icon-background.png',Buffer.concat([Buffer.from([137,80,78,71,13,10,26,10]),chk('IHDR',ihdr),chk('IDAT',zlib.deflateSync(raw)),chk('IEND',Buffer.alloc(0))]));"
          npx capacitor-assets generate --android --iconBackgroundColor '#EA580C' --splashBackgroundColor '#F8FAFC' || true
          if ! find android/app/src/main/res -name "ic_launcher_background.*" | grep -q .; then
            mkdir -p android/app/src/main/res/mipmap-xxxhdpi
            cp assets/icon-background.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_background.png
          fi
          npx cap sync android

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MputPos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
